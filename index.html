<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b8fc9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Port Zélande" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="description" content="Pirates of Port Zélande — bevrijd Jan Driessen uit handen van de piraten!" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23f6c33b' stroke='%232d1e2f' stroke-width='5'/%3E%3Ctext x='32' y='43' font-size='30' text-anchor='middle'%3E%E2%98%A0%3C/text%3E%3C/svg%3E" />
    <title>Pirates of Port Zélande</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0f3d5c; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #game { position: fixed; inset: 0; }
      #game canvas { display: block; }
      #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #0f3d5c; color: #fff8e7; font-family: 'Fredoka', system-ui, sans-serif; text-align: center; align-items: center; justify-content: center; flex-direction: column; gap: 16px; padding: 24px; box-sizing: border-box; }
      #rotate .phone { width: 56px; height: 92px; border: 6px solid #fff8e7; border-radius: 12px; animation: rot 2s ease-in-out infinite; }
      @keyframes rot { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
      #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff8e7; font: 600 22px system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <div id="loading">Anker ophalen…</div>
    <div id="game"></div>
    <div id="rotate"><div class="phone"></div><div style="font-size:22px;font-weight:600">Draai je telefoon</div><div>Pirates of Port Zélande speel je in liggende stand.</div></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
